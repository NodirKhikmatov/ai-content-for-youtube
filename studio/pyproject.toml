[project]
name = "studio"
version = "0.1.0"
description = "The Turning Point — autonomous content pipeline (Phase 1 MVP)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "boto3>=1.35",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "elevenlabs>=1.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]

[[tool.mypy.overrides]]
# boto3/botocore ship no py.typed marker; there's no first-party fix for this.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
