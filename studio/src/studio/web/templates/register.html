{% extends "base.html" %}
{% block title %}Create Account — AI YouTube Studio{% endblock %}
{% block content %}
<div style="max-width:440px; margin: 40px auto;">
  <div class="card" style="padding: 28px;">
    <h1 style="margin: 0 0 8px; font-size: 24px; text-align: center;">🚀 Create Account</h1>
    <p class="muted" style="text-align: center; font-size: 14px; margin-bottom: 24px;">Start generating AI YouTube videos, manhwa recaps & shorts.</p>

    {% if error %}
    <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid var(--bad); color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;">
      {{ error }}
    </div>
    {% endif %}

    <form action="/register" method="post">
      <div class="form-group">
        <label class="form-label" for="full_name">Your Name</label>
        <input type="text" id="full_name" name="full_name" required placeholder="John Doe" autofocus>
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters">
      </div>

      <button class="btn" type="submit" style="width: 100%; margin-top: 20px; padding: 12px; font-size: 15px;">Create Studio Account</button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 13px;" class="muted">
      Already have an account? <a href="/login" style="color: var(--accent); text-decoration: underline;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
