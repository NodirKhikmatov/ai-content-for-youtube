<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}The Turning Point — Studio{% endblock %}</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #131720;
    --panel-hover: #1a202c;
    --border: #222938;
    --border-light: #2d3748;
    --text: #f0f4f8;
    --muted: #8c9ba5;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    --good: #10b981;
    --warn: #f59e0b;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; margin: 0; line-height: 1.5; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 28px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
  .header-left, .header-right { display: flex; align-items: center; gap: 20px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: color .15s ease; }
  header a.brand { font-weight: 700; font-size: 17px; color: var(--text); background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-right: 12px; }
  header a:hover { color: var(--text); }
  header a.active { color: var(--text); font-weight: 600; }
  main { max-width: 1060px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 18px; letter-spacing: -0.02em; }
  h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 32px 0 12px; font-weight: 700; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  a.row-link { color: var(--text); text-decoration: none; }
  a.row-link:hover { color: #818cf8; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .badge.ok, .badge.succeeded, .badge.finished, .badge.approved, .badge.published, .badge.produced { background: rgba(16,185,129,.15); color: var(--good); border: 1px solid rgba(16,185,129,.3); }
  .badge.warn, .badge.running, .badge.paused, .badge.in_review, .badge.scripted, .badge.researched, .badge.sourced { background: rgba(245,158,11,.15); color: var(--warn); border: 1px solid rgba(245,158,11,.3); }
  .badge.bad, .badge.failed, .badge.rejected { background: rgba(239,68,68,.15); color: var(--bad); border: 1px solid rgba(239,68,68,.3); }
  .muted { color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent-gradient); color: #fff; border: none; padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; transition: transform .1s ease, opacity .15s ease; }
  .btn:hover { opacity: .95; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.secondary { background: transparent; border: 1px solid var(--border-light); color: var(--text); }
  .btn.secondary:hover { background: var(--panel-hover); border-color: var(--muted); }
  .btn.danger { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.5); color: #fca5a5; }
  .btn.danger:hover { background: rgba(239,68,68,0.3); }
  form.inline { display: inline; }
  video { width: 100%; max-width: 460px; border-radius: 10px; background: #000; display: block; margin: 12px 0; border: 1px solid var(--border); }
  video.vertical { max-width: 240px; }
  input[type=text], input[type=password], select { background: #07090d; border: 1px solid var(--border-light); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; width: 100%; transition: border-color .15s ease; }
  input[type=text]:focus, input[type=password]:focus, select:focus, textarea:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }
  textarea { background: #07090d; border: 1px solid var(--border-light); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px; width: 100%; min-height: 80px; resize: vertical; }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .form-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .empty { color: var(--muted); font-size: 14px; padding: 14px 0; text-align: center; }
  code { background: #07090d; padding: 2px 7px; border-radius: 5px; font-size: 12px; border: 1px solid var(--border); color: #cbd5e1; }
  .alert-box { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 18px; }
  .alert-box.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #6ee7b7; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <div class="header-left">
    <a class="brand" href="/">The Turning Point</a>
    <a href="/">Dashboard</a>
    <a href="/create">✨ Create Video</a>
    <a href="/videos">Videos</a>
    <a href="/backlog">Backlog</a>
  </div>
  <div class="header-right">
    <a class="btn secondary" href="/settings" style="padding:6px 12px; font-size:13px;">⚙️ Settings & API Keys</a>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
